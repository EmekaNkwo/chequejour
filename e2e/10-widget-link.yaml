# The widget opens chequejour://daily/word?day=<today> (built in features/widget/widget-data.ts).
# Placing a widget can't be automated on every launcher, so this flow opens the same link.
appId: com.emeka.chequejour
---
- runFlow: common/fresh-start.yaml
- evalScript: ${output.day = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}
- openLink: chequejour://daily/word?day=${output.day}
- assertVisible:
    id: word-screen
- setAirplaneMode: disabled
